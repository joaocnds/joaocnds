<svg xmlns="http://www.w3.org/2000/svg" width="850" height="720" viewBox="0 0 850 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6e40c9"/>
      <stop offset="50%" style="stop-color:#8957e5"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6e40c9"/>
      <stop offset="100%" style="stop-color:#8957e5"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f3d73"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="nodeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6feb"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <linearGradient id="nodeFuture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8957e5"/>
      <stop offset="100%" style="stop-color:#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#d2a8ff;#bc8cff" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes slideRight { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideLeft { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 0.4; r: 5; } 50% { opacity: 0.9; r: 7; } }
    @keyframes pulseRing { 0%,100% { r: 12; opacity: 0.3; } 50% { r: 16; opacity: 0.1; } }
    @keyframes drawLine { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes glowPulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.35; } }
    .title { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 14px; }
    .date { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }
    .desc { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #c9d1d9; }
    .tag { font-family: 'Fira Code', monospace; font-size: 10px; }
  </style>

  <!-- Background -->
  <rect width="850" height="720" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Background grid -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="850" y2="100" stroke="#8957e5" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="850" y2="200" stroke="#8957e5" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="850" y2="300" stroke="#8957e5" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="850" y2="400" stroke="#8957e5" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="850" y2="500" stroke="#8957e5" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="850" y2="600" stroke="#8957e5" stroke-width="0.5"/>
    <line x1="425" y1="0" x2="425" y2="720" stroke="#8957e5" stroke-width="0.5"/>
  </g>

  <!-- Central timeline line -->
  <line x1="425" y1="40" x2="425" y2="680" stroke="url(#line)" stroke-width="3" stroke-dasharray="600" style="animation: drawLine 2s ease-out forwards" filter="url(#glow)"/>

  <!-- Ambient glow behind line -->
  <line x1="425" y1="40" x2="425" y2="680" stroke="#8957e5" stroke-width="20" opacity="0.05" filter="url(#softGlow)"/>

  <!-- ══════ NODE 1: SENAI — Mar 2024 (LEFT) ══════ -->
  <g style="animation: slideRight 0.6s ease-out 0.3s both">
    <!-- Connector -->
    <line x1="340" y1="75" x2="420" y2="75" stroke="#6e40c9" stroke-width="2" opacity="0.5"/>
    <!-- Node dot -->
    <circle cx="425" cy="75" r="8" fill="url(#nodePurple)" filter="url(#glow)"/>
    <circle cx="425" cy="75" fill="none" stroke="#8957e5" stroke-width="1" opacity="0.3" style="animation: pulseRing 2s ease-in-out infinite">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Card -->
    <rect x="60" y="48" width="280" height="55" rx="8" fill="#161b22" stroke="#6e40c9" stroke-width="1.5" opacity="0.9"/>
    <rect x="60" y="48" width="4" height="55" rx="2" fill="#6e40c9"/>
    <text x="78" y="68" class="date">Mar 2024</text>
    <text x="78" y="85" class="title" fill="#bc8cff">Primeiro contato com código</text>
    <text x="78" y="98" class="desc">Curso de Programação Web no SENAI</text>
    <!-- Tags -->
    <rect x="245" y="61" width="42" height="16" rx="8" fill="#6e40c9" opacity="0.2"/>
    <text x="266" y="72" class="tag" fill="#bc8cff" text-anchor="middle">HTML</text>
    <rect x="291" y="61" width="38" height="16" rx="8" fill="#6e40c9" opacity="0.2"/>
    <text x="310" y="72" class="tag" fill="#bc8cff" text-anchor="middle">CSS</text>
  </g>

  <!-- ══════ NODE 2: ETEC — Ago 2024 (RIGHT) ══════ -->
  <g style="animation: slideLeft 0.6s ease-out 0.7s both">
    <line x1="430" y1="170" x2="510" y2="170" stroke="#1f6feb" stroke-width="2" opacity="0.5"/>
    <circle cx="425" cy="170" r="8" fill="url(#nodeBlue)" filter="url(#glow)"/>
    <circle cx="425" cy="170" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="12;16;12" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="510" y="135" width="280" height="72" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" opacity="0.9"/>
    <rect x="786" y="135" width="4" height="72" rx="2" fill="#1f6feb"/>
    <text x="524" y="157" class="date">Ago 2024</text>
    <text x="524" y="174" class="title" fill="#58a6ff">Início na ETEC</text>
    <text x="524" y="188" class="desc">Técnico em Desenvolvimento de Sistemas</text>
    <text x="524" y="202" class="desc" fill="#8b949e">Java · PHP · Mobile · SQL · n8n</text>
  </g>

  <!-- ══════ NODE 3: Conclusão ETEC — Dez 2025 (LEFT) ══════ -->
  <g style="animation: slideRight 0.6s ease-out 1.1s both">
    <line x1="340" y1="280" x2="420" y2="280" stroke="#3fb950" stroke-width="2" opacity="0.5"/>
    <circle cx="425" cy="280" r="8" fill="url(#nodeGreen)" filter="url(#glow)"/>
    <circle cx="425" cy="280" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="60" y="253" width="280" height="55" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" opacity="0.9"/>
    <rect x="60" y="253" width="4" height="55" rx="2" fill="#3fb950"/>
    <text x="78" y="273" class="date">Dez 2025</text>
    <text x="78" y="290" class="title" fill="#3fb950">Conclusão da ETEC ✅</text>
    <text x="78" y="303" class="desc">Formado em Desenvolvimento de Sistemas</text>
  </g>

  <!-- ══════ NODE 4: Dentsply — Mar 2026 (RIGHT) ══════ -->
  <g style="animation: slideLeft 0.6s ease-out 1.5s both">
    <line x1="430" y1="385" x2="510" y2="385" stroke="#8957e5" stroke-width="2" opacity="0.5"/>
    <circle cx="425" cy="385" r="8" fill="url(#nodePurple)" filter="url(#glow)"/>
    <circle cx="425" cy="385" fill="none" stroke="#8957e5" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="12;16;12" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="510" y="348" width="280" height="85" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1.5" opacity="0.9"/>
    <rect x="786" y="348" width="4" height="85" rx="2" fill="#8957e5"/>
    <text x="524" y="368" class="date">Mar 2026</text>
    <text x="524" y="386" class="title" fill="#bc8cff">Dentsply Sirona</text>
    <text x="524" y="400" class="desc">Marketing Digital — 5 contas gerenciadas</text>
    <text x="524" y="414" class="desc" fill="#8b949e">Salesforce · CIM360 · Landing Pages</text>
    <text x="524" y="428" class="desc" fill="#d2a8ff">Desenvolvendo MIS Next (plataforma interna)</text>
  </g>

  <!-- ══════ NODE 5: Faculdade — Ago 2026 (LEFT) ══════ -->
  <g style="animation: slideRight 0.6s ease-out 1.9s both">
    <line x1="340" y1="490" x2="420" y2="490" stroke="#1f6feb" stroke-width="2" opacity="0.5"/>
    <circle cx="425" cy="490" r="8" fill="url(#nodeCyan)" filter="url(#glow)"/>
    <circle cx="425" cy="490" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="12;16;12" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <rect x="60" y="463" width="280" height="55" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" opacity="0.9"/>
    <rect x="60" y="463" width="4" height="55" rx="2" fill="#1f6feb"/>
    <text x="78" y="483" class="date">Ago 2026</text>
    <text x="78" y="500" class="title" fill="#58a6ff">Engenharia de Software 🎓</text>
    <text x="78" y="513" class="desc">Graduação — foco em desenvolvimento full-cycle</text>
  </g>

  <!-- ══════ NODE 6: Agora (RIGHT) ══════ -->
  <g style="animation: slideLeft 0.6s ease-out 2.3s both">
    <line x1="430" y1="580" x2="510" y2="580" stroke="#8957e5" stroke-width="2" opacity="0.5"/>
    <circle cx="425" cy="580" r="9" fill="url(#nodePurple)" filter="url(#glow)"/>
    <circle cx="425" cy="580" fill="none" stroke="#bc8cff" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="13;18;13" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="510" y="553" width="280" height="55" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5" opacity="0.9"/>
    <rect x="786" y="553" width="4" height="55" rx="2" fill="#bc8cff"/>
    <text x="524" y="573" class="date">Agora</text>
    <text x="524" y="590" class="title" fill="#d2a8ff">Construindo portfólio público</text>
    <text x="524" y="604" class="desc">Open source · mobile apps · automações com IA</text>
  </g>

  <!-- ══════ NODE 7: Futuro (CENTER) ══════ -->
  <g style="animation: fadeIn 1s ease-out 2.8s both">
    <circle cx="425" cy="665" r="10" fill="url(#nodeFuture)" filter="url(#glow)" style="animation: float 3s ease-in-out infinite"/>
    <circle cx="425" cy="665" fill="none" stroke="#bc8cff" stroke-width="1" style="animation: pulseRing 2s ease-in-out infinite">
      <animate attributeName="r" values="14;20;14" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="310" y="640" width="230" height="50" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="1" stroke-dasharray="4,4" opacity="0.8" style="animation: float 3s ease-in-out infinite"/>
    <text x="425" y="662" class="title" fill="#bc8cff" text-anchor="middle" style="animation: float 3s ease-in-out infinite">🔮 Próximo</text>
    <text x="425" y="680" class="desc" fill="#8b949e" text-anchor="middle" font-size="11" style="animation: float 3s ease-in-out infinite">Open source · Arquitetura · Transição para eng.</text>
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="130" r="1.5" fill="#6e40c9" style="animation: pulse 3s ease-in-out infinite"/>
  <circle cx="750" cy="90" r="1" fill="#8957e5" style="animation: pulse 4s ease-in-out infinite 1s"/>
  <circle cx="80" cy="400" r="1.5" fill="#1f6feb" style="animation: pulse 3.5s ease-in-out infinite 0.5s"/>
  <circle cx="770" cy="500" r="1" fill="#bc8cff" style="animation: pulse 2.5s ease-in-out infinite 2s"/>
  <circle cx="200" cy="600" r="1.5" fill="#8957e5" style="animation: pulse 4s ease-in-out infinite 1.5s"/>
  <circle cx="700" cy="650" r="1" fill="#6e40c9" style="animation: pulse 3s ease-in-out infinite 0.8s"/>
</svg>
