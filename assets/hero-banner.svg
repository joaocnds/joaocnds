<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8957e5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1f3d73;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bc8cff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#f778ba;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#79c0ff">
        <animate attributeName="stop-color" values="#79c0ff;#bc8cff;#f778ba;#79c0ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#f778ba;#79c0ff;#bc8cff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f778ba">
        <animate attributeName="stop-color" values="#f778ba;#79c0ff;#bc8cff;#f778ba" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes float1 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes float2 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(8px); } }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
    @keyframes dash { to { stroke-dashoffset: -1000; } }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes fadeSlide { 0%,100% { opacity: 0.4; transform: translateX(-20px); } 50% { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes scanline { 0% { transform: translateY(-300px); } 100% { transform: translateY(300px); } }
  </style>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Scanline effect -->
  <rect width="900" height="2" fill="#58a6ff" opacity="0.04">
    <animateTransform attributeName="transform" type="translate" values="0,-300;0,300" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="50" x2="900" y2="50" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="900" y2="100" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="900" y2="150" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="900" y2="250" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Floating particles -->
  <circle cx="120" cy="60" r="2" fill="#58a6ff" opacity="0.5" style="animation: pulse 3s ease-in-out infinite"/>
  <circle cx="780" cy="80" r="1.5" fill="#bc8cff" opacity="0.5" style="animation: pulse 4s ease-in-out infinite 1s"/>
  <circle cx="650" cy="240" r="2" fill="#f778ba" opacity="0.4" style="animation: pulse 3.5s ease-in-out infinite 0.5s"/>
  <circle cx="200" cy="220" r="1.5" fill="#58a6ff" opacity="0.5" style="animation: pulse 2.5s ease-in-out infinite 2s"/>
  <circle cx="450" cy="40" r="1" fill="#79c0ff" opacity="0.6" style="animation: pulse 4s ease-in-out infinite 0.8s"/>
  <circle cx="350" cy="260" r="1.5" fill="#bc8cff" opacity="0.4" style="animation: pulse 3s ease-in-out infinite 1.5s"/>
  <circle cx="820" cy="180" r="1" fill="#f778ba" opacity="0.5" style="animation: pulse 3.5s ease-in-out infinite 0.3s"/>
  <circle cx="70" cy="150" r="2" fill="#79c0ff" opacity="0.3" style="animation: pulse 4.5s ease-in-out infinite 2.5s"/>

  <!-- Animated circuit lines -->
  <path d="M 0 150 Q 100 120, 200 150 T 400 140 T 600 160 T 900 150" fill="none" stroke="url(#glow1)" stroke-width="1" opacity="0.3" stroke-dasharray="10,20" style="animation: dash 20s linear infinite"/>
  <path d="M 0 180 Q 150 200, 300 170 T 600 190 T 900 180" fill="none" stroke="url(#glow2)" stroke-width="1" opacity="0.2" stroke-dasharray="8,25" style="animation: dash 25s linear infinite"/>

  <!-- Decorative brackets -->
  <text x="80" y="155" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="60" fill="#58a6ff" opacity="0.15" style="animation: float1 6s ease-in-out infinite">{</text>
  <text x="790" y="175" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="60" fill="#bc8cff" opacity="0.15" style="animation: float2 5s ease-in-out infinite">}</text>

  <!-- Code snippets floating -->
  <text x="60" y="85" font-family="'Fira Code', monospace" font-size="10" fill="#58a6ff" opacity="0.2" style="animation: fadeSlide 8s ease-in-out infinite">const future = await build()</text>
  <text x="620" y="45" font-family="'Fira Code', monospace" font-size="10" fill="#bc8cff" opacity="0.2" style="animation: fadeSlide 7s ease-in-out infinite 2s">import { passion } from 'life'</text>
  <text x="550" y="275" font-family="'Fira Code', monospace" font-size="10" fill="#f778ba" opacity="0.2" style="animation: fadeSlide 9s ease-in-out infinite 4s">while(alive) { learn() }</text>
  <text x="80" y="260" font-family="'Fira Code', monospace" font-size="10" fill="#79c0ff" opacity="0.2" style="animation: fadeSlide 6s ease-in-out infinite 1s">git commit -m "never stop"</text>

  <!-- Main name -->
  <text x="450" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="url(#textGrad)" text-anchor="middle" filter="url(#glowFilter)">João Vitor Cassiano</text>

  <!-- Subtitle with terminal style -->
  <g style="animation: float1 8s ease-in-out infinite">
    <rect x="245" y="145" width="410" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="260" cy="160" r="4" fill="#f778ba"/>
    <circle cx="275" cy="160" r="4" fill="#ffd700"/>
    <circle cx="290" cy="160" r="4" fill="#3fb950"/>
    <text x="310" y="165" font-family="'Fira Code', monospace" font-size="13" fill="#8b949e">
      <tspan fill="#bc8cff">~</tspan> do marketing ao código <tspan fill="#58a6ff" style="animation: blink 1s step-end infinite">▊</tspan>
    </text>
  </g>

  <!-- Role tags -->
  <g transform="translate(450, 210)" text-anchor="middle">
    <rect x="-210" y="-14" width="130" height="24" rx="12" fill="#1f6feb" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="-145" y="4" font-family="'Segoe UI', sans-serif" font-size="11" fill="#79c0ff" text-anchor="middle">Software Engineer</text>

    <rect x="-60" y="-14" width="120" height="24" rx="12" fill="#8957e5" opacity="0.2" stroke="#bc8cff" stroke-width="1"/>
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d2a8ff" text-anchor="middle">Marketing Digital</text>

    <rect x="80" y="-14" width="130" height="24" rx="12" fill="#da3633" opacity="0.15" stroke="#f778ba" stroke-width="1"/>
    <text x="145" y="4" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f778ba" text-anchor="middle">Process Automation</text>
  </g>

  <!-- Bottom glow line -->
  <rect x="200" y="255" width="500" height="2" rx="1" fill="url(#glow1)" opacity="0.4"/>
  <rect x="250" y="260" width="400" height="1" rx="1" fill="url(#glow2)" opacity="0.2"/>

  <!-- Corner accents -->
  <path d="M 0 0 L 40 0 L 40 3 L 3 3 L 3 40 L 0 40 Z" fill="#58a6ff" opacity="0.3"/>
  <path d="M 900 0 L 860 0 L 860 3 L 897 3 L 897 40 L 900 40 Z" fill="#bc8cff" opacity="0.3"/>
  <path d="M 0 300 L 40 300 L 40 297 L 3 297 L 3 260 L 0 260 Z" fill="#f778ba" opacity="0.3"/>
  <path d="M 900 300 L 860 300 L 860 297 L 897 297 L 897 260 L 900 260 Z" fill="#79c0ff" opacity="0.3"/>
</svg>
