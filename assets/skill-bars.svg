<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9"/>
      <stop offset="100%" style="stop-color:#8957e5"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8957e5"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1158c7"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fillBar1 { from { width: 0; } to { width: 380px; } }
    @keyframes fillBar2 { from { width: 0; } to { width: 380px; } }
    @keyframes fillBar3 { from { width: 0; } to { width: 300px; } }
    @keyframes fillBar4 { from { width: 0; } to { width: 300px; } }
    @keyframes fillBar5 { from { width: 0; } to { width: 280px; } }
    @keyframes fillBar6 { from { width: 0; } to { width: 260px; } }
    @keyframes fillBar7 { from { width: 0; } to { width: 240px; } }
    @keyframes fillBar8 { from { width: 0; } to { width: 180px; } }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(500px); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  </style>

  <!-- Background -->
  <rect width="800" height="380" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="35" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#bc8cff" text-anchor="middle" letter-spacing="3">SKILL PROFICIENCY</text>
  <rect x="300" y="42" width="200" height="1" fill="#6e40c9" opacity="0.5"/>

  <!-- Skill bars -->
  <!-- Java -->
  <g style="animation: fadeIn 0.5s ease-out 0.1s both">
    <text x="40" y="82" font-family="'Fira Code', monospace" font-size="13" fill="#d2a8ff">Java</text>
    <rect x="180" y="70" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="70" width="0" height="16" rx="8" fill="url(#bar1)" filter="url(#glow)" style="animation: fillBar1 1.5s ease-out 0.3s forwards"/>
    <text x="590" y="83" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">95%</text>
  </g>

  <!-- HTML/CSS/JS -->
  <g style="animation: fadeIn 0.5s ease-out 0.3s both">
    <text x="40" y="122" font-family="'Fira Code', monospace" font-size="13" fill="#79c0ff">HTML/CSS/JS</text>
    <rect x="180" y="110" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="110" width="0" height="16" rx="8" fill="url(#bar2)" filter="url(#glow)" style="animation: fillBar2 1.5s ease-out 0.5s forwards"/>
    <text x="590" y="123" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">95%</text>
  </g>

  <!-- SQL -->
  <g style="animation: fadeIn 0.5s ease-out 0.5s both">
    <text x="40" y="162" font-family="'Fira Code', monospace" font-size="13" fill="#d2a8ff">SQL</text>
    <rect x="180" y="150" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="150" width="0" height="16" rx="8" fill="url(#bar3)" filter="url(#glow)" style="animation: fillBar3 1.5s ease-out 0.7s forwards"/>
    <text x="590" y="163" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">75%</text>
  </g>

  <!-- React Native -->
  <g style="animation: fadeIn 0.5s ease-out 0.7s both">
    <text x="40" y="202" font-family="'Fira Code', monospace" font-size="13" fill="#79c0ff">React Native</text>
    <rect x="180" y="190" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="190" width="0" height="16" rx="8" fill="url(#bar4)" filter="url(#glow)" style="animation: fillBar4 1.5s ease-out 0.9s forwards"/>
    <text x="590" y="203" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">75%</text>
  </g>

  <!-- Python -->
  <g style="animation: fadeIn 0.5s ease-out 0.9s both">
    <text x="40" y="242" font-family="'Fira Code', monospace" font-size="13" fill="#d2a8ff">Python</text>
    <rect x="180" y="230" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="230" width="0" height="16" rx="8" fill="url(#bar1)" filter="url(#glow)" style="animation: fillBar5 1.5s ease-out 1.1s forwards"/>
    <text x="590" y="243" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">70%</text>
  </g>

  <!-- n8n -->
  <g style="animation: fadeIn 0.5s ease-out 1.1s both">
    <text x="40" y="282" font-family="'Fira Code', monospace" font-size="13" fill="#79c0ff">n8n</text>
    <rect x="180" y="270" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="270" width="0" height="16" rx="8" fill="url(#bar2)" filter="url(#glow)" style="animation: fillBar6 1.5s ease-out 1.3s forwards"/>
    <text x="590" y="283" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">65%</text>
  </g>

  <!-- PHP -->
  <g style="animation: fadeIn 0.5s ease-out 1.3s both">
    <text x="40" y="322" font-family="'Fira Code', monospace" font-size="13" fill="#d2a8ff">PHP</text>
    <rect x="180" y="310" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="310" width="0" height="16" rx="8" fill="url(#bar3)" filter="url(#glow)" style="animation: fillBar7 1.5s ease-out 1.5s forwards"/>
    <text x="590" y="323" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">60%</text>
  </g>

  <!-- TypeScript -->
  <g style="animation: fadeIn 0.5s ease-out 1.5s both">
    <text x="40" y="362" font-family="'Fira Code', monospace" font-size="13" fill="#79c0ff">TypeScript</text>
    <rect x="180" y="350" width="400" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="350" width="0" height="16" rx="8" fill="url(#bar4)" filter="url(#glow)" style="animation: fillBar8 1.5s ease-out 1.7s forwards"/>
    <text x="590" y="363" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">45%</text>
  </g>
</svg>
