<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1e24"/>
      <stop offset="100%" style="stop-color:#21262d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9"/>
      <stop offset="100%" style="stop-color:#8957e5"/>
    </linearGradient>
    <linearGradient id="sideGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6e40c9;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#8957e5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6e40c9;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="0" y="0" width="850" height="420" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes scanline { 0% { transform: translateY(-420px); } 100% { transform: translateY(420px); } }
    @keyframes typeKey { from { width: 0; } to { width: 100%; } }
    @keyframes gradShift { 0% { stop-color: #6e40c9; } 50% { stop-color: #bc8cff; } 100% { stop-color: #6e40c9; } }
    .line { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; }
    .key { fill: #bc8cff; }
    .str { fill: #a5d6ff; }
    .sym { fill: #8b949e; }
    .comment { fill: #6e7681; font-style: italic; }
    .bullet { fill: #8957e5; }
    .emoji { font-size: 14px; }
  </style>

  <g clip-path="url(#termClip)">
    <!-- Background -->
    <rect width="850" height="420" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

    <!-- Scanline -->
    <rect width="850" height="3" fill="#8957e5" opacity="0.03">
      <animateTransform attributeName="transform" type="translate" values="0,-420;0,420" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Left accent bar -->
    <rect x="0" y="36" width="3" height="384" fill="url(#sideGlow)"/>

    <!-- Title bar -->
    <rect width="850" height="36" fill="url(#titleBar)" rx="12"/>
    <rect x="0" y="24" width="850" height="12" fill="url(#titleBar)"/>

    <!-- Window buttons -->
    <circle cx="20" cy="18" r="6" fill="#f778ba" opacity="0.9"/>
    <circle cx="40" cy="18" r="6" fill="#ffd700" opacity="0.9"/>
    <circle cx="60" cy="18" r="6" fill="#3fb950" opacity="0.9"/>

    <!-- Title text -->
    <text x="425" y="23" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">sobre_mim.yaml — joaocnds</text>

    <!-- Tab indicator -->
    <rect x="320" y="33" width="210" height="3" fill="#8957e5" rx="1.5"/>

    <!-- Line numbers background -->
    <rect x="3" y="36" width="40" height="384" fill="#0d1117" opacity="0.5"/>

    <!-- Line numbers -->
    <g font-family="'Fira Code', monospace" font-size="11" fill="#30363d" text-anchor="right">
      <text x="35" y="62">1</text>
      <text x="35" y="82">2</text>
      <text x="35" y="102">3</text>
      <text x="35" y="122">4</text>
      <text x="35" y="142">5</text>
      <text x="35" y="162">6</text>
      <text x="35" y="182">7</text>
      <text x="35" y="202">8</text>
      <text x="35" y="222">9</text>
      <text x="35" y="242">10</text>
      <text x="35" y="262">11</text>
      <text x="35" y="282">12</text>
      <text x="35" y="302">13</text>
      <text x="35" y="322">14</text>
      <text x="35" y="342">15</text>
      <text x="35" y="362">16</text>
      <text x="35" y="382">17</text>
      <text x="35" y="402">18</text>
    </g>

    <!-- Active line highlight -->
    <rect x="43" y="48" width="804" height="20" fill="#6e40c9" opacity="0.08"/>

    <!-- Code content with slide-in animations -->

    <!-- Line 1: comment -->
    <g style="animation: slideIn 0.4s ease-out 0.1s both">
      <text x="55" y="62" class="line comment"># 🧑‍💻 about_me.yaml</text>
    </g>

    <!-- Line 2: empty -->

    <!-- Line 3: name -->
    <g style="animation: slideIn 0.4s ease-out 0.3s both">
      <text x="55" y="102" class="line">
        <tspan class="key">name</tspan><tspan class="sym">: </tspan><tspan class="str">"João Vitor Cassiano"</tspan>
      </text>
    </g>

    <!-- Line 4: location -->
    <g style="animation: slideIn 0.4s ease-out 0.5s both">
      <text x="55" y="122" class="line">
        <tspan class="key">location</tspan><tspan class="sym">: </tspan><tspan class="str">"São Paulo, BR"</tspan><tspan class="emoji"> 🇧🇷</tspan>
      </text>
    </g>

    <!-- Line 5: company -->
    <g style="animation: slideIn 0.4s ease-out 0.7s both">
      <text x="55" y="142" class="line">
        <tspan class="key">company</tspan><tspan class="sym">: </tspan><tspan class="str">"Dentsply Sirona — Marketing Digital"</tspan>
      </text>
    </g>

    <!-- Line 6: education -->
    <g style="animation: slideIn 0.4s ease-out 0.9s both">
      <text x="55" y="162" class="line">
        <tspan class="key">education</tspan><tspan class="sym">: </tspan><tspan class="str">"Engenharia de Software"</tspan><tspan class="emoji"> 🎓</tspan>
      </text>
    </g>

    <!-- Line 7: empty -->

    <!-- Line 8: interests header -->
    <g style="animation: slideIn 0.4s ease-out 1.1s both">
      <text x="55" y="202" class="line">
        <tspan class="key">interests</tspan><tspan class="sym">:</tspan>
      </text>
    </g>

    <!-- Line 9-12: interests -->
    <g style="animation: slideIn 0.4s ease-out 1.3s both">
      <text x="55" y="222" class="line">
        <tspan class="sym">  - </tspan><tspan class="str">"Web &amp; Mobile Development"</tspan>
      </text>
    </g>
    <g style="animation: slideIn 0.4s ease-out 1.5s both">
      <text x="55" y="242" class="line">
        <tspan class="sym">  - </tspan><tspan class="str">"Data Engineering &amp; Analytics"</tspan>
      </text>
    </g>
    <g style="animation: slideIn 0.4s ease-out 1.7s both">
      <text x="55" y="262" class="line">
        <tspan class="sym">  - </tspan><tspan class="str">"Process Automation"</tspan>
      </text>
    </g>
    <g style="animation: slideIn 0.4s ease-out 1.9s both">
      <text x="55" y="282" class="line">
        <tspan class="sym">  - </tspan><tspan class="str">"AI-Powered Solutions"</tspan>
      </text>
    </g>

    <!-- Line 13: empty -->

    <!-- Line 14: currently_learning -->
    <g style="animation: slideIn 0.4s ease-out 2.1s both">
      <text x="55" y="322" class="line">
        <tspan class="key">currently_learning</tspan><tspan class="sym">:</tspan>
      </text>
    </g>
    <g style="animation: slideIn 0.4s ease-out 2.3s both">
      <text x="55" y="342" class="line">
        <tspan class="sym">  - </tspan><tspan class="str">"React Native + Expo"</tspan>
      </text>
    </g>
    <g style="animation: slideIn 0.4s ease-out 2.5s both">
      <text x="55" y="362" class="line">
        <tspan class="sym">  - </tspan><tspan class="str">"TypeScript"</tspan>
      </text>
    </g>

    <!-- Line 17: fun_fact -->
    <g style="animation: slideIn 0.4s ease-out 2.7s both">
      <text x="55" y="402" class="line">
        <tspan class="key">fun_fact</tspan><tspan class="sym">: </tspan><tspan class="str">"Comecei no marketing, mas o código me escolheu"</tspan><tspan class="emoji"> 🤓</tspan>
      </text>
    </g>

    <!-- Blinking cursor -->
    <rect x="548" y="390" width="8" height="16" fill="#8957e5" style="animation: blink 1s step-end infinite"/>

    <!-- Status bar -->
    <rect x="0" y="408" width="850" height="20" fill="#1a1e24" rx="0"/>
    <text x="15" y="419" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">YAML</text>
    <text x="100" y="419" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">UTF-8</text>
    <text x="200" y="419" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">Ln 18, Col 55</text>

    <!-- Status bar right -->
    <circle cx="780" cy="414" r="4" fill="#3fb950"/>
    <text x="790" y="419" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3fb950">ready</text>

    <!-- Floating particles -->
    <circle cx="750" cy="80" r="1.5" fill="#8957e5" opacity="0.4" style="animation: pulse 3s ease-in-out infinite"/>
    <circle cx="800" cy="200" r="1" fill="#bc8cff" opacity="0.3" style="animation: pulse 4s ease-in-out infinite 1s"/>
    <circle cx="780" cy="340" r="1.5" fill="#6e40c9" opacity="0.4" style="animation: pulse 3.5s ease-in-out infinite 2s"/>
  </g>
</svg>
